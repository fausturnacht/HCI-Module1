<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tourism Explorer</title>
<link rel="stylesheet" href="assets/css/main.css">
<link rel="stylesheet" href="assets/css/footer.css">
<link rel="stylesheet" href="assets/css/pages/login.css">
</head>
<body>
    <special-header></special-header>
  <section id="login" class="active">
    <div class="login-wrap">
      <h1 class="login-title">Welcome</h1>
      <div class="login-sub">Login with Email</div>

      <div class="field">
        <label class="label" for="email">Email id</label>
        <div class="input-wrap">
          <span class="icon" aria-hidden="true">📧</span>
          <input id="email" type="email" class="input" placeholder="thisuix@email.com" autocomplete="email">
        </div>
      </div>

      <div class="field">
        <label class="label" for="password">Password</label>
        <div class="input-wrap">
          <span class="icon" aria-hidden="true">🔒</span>
          <input id="password" type="password" class="input" placeholder="••••••••••••" autocomplete="current-password">
        </div>
      </div>

      <div class="row-flex"><span></span><a href="#" class="forgot">Forgot your password?</a></div>

      <button class="btn-primary">LOGIN</button>
      <div class="divider">OR</div>
      <div class="social-row">
        <button class="sbtn" aria-label="Continue with Google">Google</button>
        <button class="sbtn" aria-label="Continue with Facebook">Facebook</button>
        <button class="sbtn" aria-label="Continue with Apple">Apple</button>
      </div>
      <div class="register">Don’t have account? <a href="#">Register Now</a></div>
    </div>
  </section>
  <special-footer></special-footer>
    <script src="assets/js/main.js"></script> <!-- Link to your JavaScript file -->
</body>
</html>
